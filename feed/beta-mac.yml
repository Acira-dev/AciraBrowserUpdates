  "releaseNotes": "- New in Settings › Profiles: put all your profiles in one window as spaces, or keep each in its own window as before.\n- Pause the update download from the top bar. It picks up where it stopped, even after you quit Acira.\n- Report a problem from the Acira menu, about a website or about Acira itself. You see exactly what is sent.\n- The command bar only shows the history of the profile you're in.\n- In AI-free mode, the \"AI answer hidden\" line is easy to read on dark pages.\n- Check for updates no longer jumps when you press it.\n- Windows: from the next update on, Acira downloads only what changed.\n- Windows: with usage sharing on, uninstalling sends one anonymous message so we know someone left. Settings › Privacy shows it."
