  "releaseName": "Acira Browser 0.1.0-beta.10",
  "releaseNotes": "- Switching between profiles is smooth: the new one appears in one step.\n- Tabs, sleeping tabs and the sidebar are easier to read on every finish, in light mode and private windows too.\n- \"Ask where to save\" shows one Save dialog, and downloads with the same name no longer overwrite each other.\n- Windows: unlocking a workspace or a saved password no longer alarms Norton and other antivirus apps. If one removed Acira, reinstall it: your data is safe.\n- Mac: when a site asks for a passkey, Acira says it can't use passkeys yet, so you can sign in with your password.\n- An address with no secure connection now asks before opening it unsecured.\n- Damaged saved data no longer leaves you stuck, and a window that stops working offers to restart with your tabs.\n- Update downloads pick up where they stopped. Plus many smaller fixes."
