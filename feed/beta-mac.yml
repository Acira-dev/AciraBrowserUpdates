  "releaseName": "Acira Browser 0.1.0-beta.7",
  "releaseNotes": "- Your tabs come back after quitting, even with several profiles.\n- Favorites are real tabs now: clicking one again takes you back to the same page.\n- Cookie banners are answered \"Reject all\" for you where a site allows it, and never hidden or accepted.\n- Site sign-in windows and dialogs (Reddit, Jack Westin and others) are never blocked.\n- Turning protection off for a site now really lets everything on it load.\n- Sites like Netflix video, Amazon and many file hosts are no longer blocked by mistake.\n- Faster animations when Animation speed is set to Fast.\n- One typeface across Acira: Inter.\n- Fullscreen fills the screen, and the top bar stays reachable.\n- The Back button no longer gets stuck on pages that redirect.\n- Many smaller fixes in navigation, Settings, translations, extensions and stability."
