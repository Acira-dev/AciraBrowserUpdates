  "releaseNotes": "- Updates reach you sooner: Acira looks for one every couple of hours, and again when your computer wakes up, instead of every 8 hours.\n- The address bar can sit in the sidebar. Sidebar mode moves tabs, the address bar and its buttons there in one smooth motion, with nothing left above the page. Right-click a sidebar section to hide it or customize the sidebar.\n- The address bar answers simple sums, unit conversions and \"time in\" a city, and finds Acira commands like Picture in picture or Settings.\n- Choose how fast the hidden sidebar and toolbar appear: Premium, Fast, or None for no animation.\n- Hold Cmd (Ctrl on Windows and Linux) to see each tab's number.\n- Mac: swipe with two fingers to go back or forward, and hold the swipe to pick an earlier page.\n- Block scripts on a site from its site menu, or everywhere from Settings. Extensions can run in private tabs if you allow them.\n- Favorites look the same however you add them, and the tab stays in your list. Tab groups in the sidebar look and open like folders.\n- Zooming with plus and minus glides like a pinch. Site icons are sharper everywhere.\n- Extension pop-ups open under their icon and are framed like Acira's own menus.\n- After you click in the sidebar or come back from another app, the page gets the keyboard again, so Space pauses and plays videos.\n- \"Continue with Google\" works on sites like Pinterest. A new install stays quiet until you finish setup.\n- Linux: Acira can match your system theme. Plus smoother view switching and many smaller fixes.",
