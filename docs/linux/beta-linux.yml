  "releaseName": "Acira Browser 0.1.0-beta.13.3",
  "releaseNotes": "- Switching between three or more profiles no longer flashes, lags or gets stuck on \"Acira couldn't display this view\".\n- New: Website appearance in Settings › Appearance. Websites can follow System, Light, Dark or Always dark, and you can leave one site out from its right-click menu.\n- Extensions: buttons work on the New Tab page and keep their order, and links in popups open as tabs.\n- Extension rules that depend on response headers work like in Chrome.\n- Downloads: Retry works every time, and a second archive.tar.gz is saved as archive (1).tar.gz.\n- A tab moved to a new window keeps its name, mute and pin.\n- Typed addresses offer http again when a site has no secure version, and Back works from error pages.\n- Windows: files named like devices, very long paths, Open with and Alt codes now work.\n- Acira uses a little less memory, and Floccus keeps the Bookmarks bar in order."
