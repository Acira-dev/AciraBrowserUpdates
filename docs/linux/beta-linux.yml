  "releaseNotes": "- Tab numbers show sooner and look crisper. The New tab row only shows its count when you point at it.\n- Fast is now clearly faster than Premium.\n- Extensions: Floccus and other bookmark sync can add and change bookmarks, popups like Surfshark's are no longer cut off, YouTube Inline Fullscreen works, and Bitwarden's autofill, badge and default-password-manager setting are fixed.\n- Extension shortcuts are easy to find from Settings › Extensions or the extensions menu, and the keys you set are kept.\n- Updates recover by themselves after a pause, a lost connection or a full disk. A failed download says so and offers Try again.\n- The update stays in view when you switch layouts.\n- Windows: the Apps list shows the right version.\n- Clearer Settings text, and Reset appearance now covers Site colour."
