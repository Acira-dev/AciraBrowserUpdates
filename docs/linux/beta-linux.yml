  "releaseName": "Acira Browser 0.1.0-beta.13.6",
  "releaseNotes": "- Split view and Seamless are much smoother: sites no longer redraw themselves on every frame while the sidebar or toolbar slides.\n- On Windows, the buttons of the top-right split pane no longer sit under the window buttons (Sidebar + address, Seamless, or with the toolbar hidden).\n- Switching tabs shows the page sooner.\n- After a zoom, the address bar shows the new size for 2 seconds, then a small magnifier. Right-click the magnifier or the bookmark star to hide it.\n- Address suggestions no longer say \"From your history\" under each row.\n- Right-click Acira in the Windows taskbar, the Mac Dock or the Linux launcher for New window and New private window.\n- \"Applies to: This profile\" now keeps that profile's finish and colours too.\n- The sidebar button no longer misses a quick third press, and the tab list no longer jumps when you switch tabs with a pinned extension."
