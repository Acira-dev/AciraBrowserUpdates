  "releaseName": "Acira Browser 0.1.0-beta.13.10",
  "releaseNotes": "- In Seamless on Windows, the sidebar appears when you move the pointer to the edge, without clicking the window first. It slides in smoothly and opens sooner.\n- Closing the tab you're on takes you back to the tab you were on before it, instead of a tab further down the list or a pinned tab you never opened.\n- \"Put to sleep\" is now \"Unload tab\", \"Unload group\" and \"Unload workspace\" in the right-click menus. Unload tab frees a tab's memory, even for a pinned tab or the tab you're on (Acira moves to another tab first). The tab keeps its place and loads again when you open it.\n- The New Tab page's search box shows suggestions as you type, the same as the address bar: your history, bookmarks and open tabs, with the same keys.\n- Coming back to Acira from another app gives the keyboard back to where you were, including an extension's side panel, a site's question or the password prompt.\n- Private windows no longer log an error each time you open Acira's menu, and their content filter settings say at once that they're unavailable there."
