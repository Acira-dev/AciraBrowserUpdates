  "releaseName": "Acira Browser 0.1.0-beta.12",
  "releaseNotes": "- The address bar in the sidebar glides into editing when you click it, and the line under it opens its buttons sooner without losing what you typed.\n- Hold Ctrl (Cmd on Mac) and type two digits to jump to tab 10 and beyond.\n- Put a tab, a group or a whole workspace to sleep from its menu. Sleeping tabs are now easy to spot.\n- Tab groups fold the moment you click them.\n- WhatsApp Web opens again.\n- Closed tabs no longer come back after a restart, and you can choose what opens when Acira starts: where you left off, or a New Tab.\n- Windows and Linux: in Sidebar mode, back, reload and forward sit in the left corner.\n- What's new shows the whole list with more room, and About names the release."
