  "releaseName": "Acira Browser 0.1.0-beta.13.8",
  "releaseNotes": "- Extension popups now fit their content every time it changes. Proton Pass after you sign in, Bitwarden's screens and others no longer leave blank space, get cut off, shrink to a tiny box at 125 % or 150 % display scale, or flash while they resize.\n- An extension's New Tab page, such as Tabrr's, opens without flashing an old page or a white screen first. It sits under Acira's sidebar and toolbar like any page, and the Seamless bar works on it.\n- In Seamless and with the toolbar hidden, the bar or sidebar you opened an extension from stays while its popup is open.\n- With YouTube Inline Fullscreen (or any video that fills the window), the bar and the sidebar still appear when you move the pointer to the edge in Seamless.\n- Extensions update themselves in the background, as in Chrome. An update that asks for new access waits until you check for updates in Settings.\n- Extensions that save files, such as Image Downloader, download again, also many files at once and into folders. A side panel you close with its own X opens again from the extension's button.\n- Sites that use Ctrl+K or Ctrl+E for their own commands, such as Webflow, now get those keys first. Acira acts only when the site doesn't use them.\n- Colorway's eyedropper opens the colour picker and picks the colour you click.\n- Inspecta's panel opens when you click its button.\n- Calendly's button works on the first press right after Acira starts, also with HubSpot Sales installed.\n- YouTube tools such as Shorts blockers keep working after Acira restarts, and extensions can remove the styles they added.\n- On Mac and Windows, the installed app was missing part of Acira's extension support, which extensions such as Colorway and Image Downloader rely on. It's back.\n- If Acira clears your data when it closes, it no longer waits for its own filter and safety lists to finish downloading. Those downloads now have a connection of their own and never use your profile's.\n- Proton VPN's first setup works: its access request is answered once, and it goes on to sign-in. Before, Allow had to be pressed three times and nothing happened.\n- An extension's side panel stays open when you press its button again, and the extension's own shortcut closes and opens it.\n- An extension page opened twice quickly opens one window, and a page that fails its first load is tried again.\n- What you type in the address bar always stays yours: it no longer jumps back to older text, loses letters to the page after a tab switch, or gets added to a site's own address change. Typing and tab switches are faster with a long history.\n- A password manager extension such as Bitwarden can be your default: its setting stays on after a restart, and Acira stops offering to save passwords while it is.\n- The bookmarks bar shows your folders: click one to open its bookmarks, with folders inside opening in place. Bookmarks imported from Edge or from Chrome in another language now land on the bar too.\n- Smoother everywhere: switching and closing tabs, opening a New Tab, resizing the window and the sidebar all do less work, and Acira no longer pauses for a moment when its filter lists update in the background.\n- Acira no longer jumps in front of the app you're using when a page in it reloads, redirects or opens a tab by itself."
