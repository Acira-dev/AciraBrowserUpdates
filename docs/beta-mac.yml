  "releaseName": "Acira Browser 0.1.0-beta.13.2",
  "releaseNotes": "- Pages and images open in a new tab again with download-manager extensions (like Mister Download Manager) installed.\n- New: Hide the toolbar. With tabs in the sidebar, the top bar can hide and comes back when you point at the top edge.\n- Right-click works inside a link preview.\n- Downloads: Delete file moves a file to the Trash or Recycle Bin, and you can drag a download into a site, a folder or an app.\n- Updates: a stopped download says so and retries. With the address in the sidebar, the line under it shows the download.\n- Fast is fast everywhere, and pinned tabs can rest when memory is tight.\n- Extensions: shortcuts work in private windows, Floccus syncs big libraries in seconds, and Bitwarden works on reopened tabs.\n- Tab glow is no longer cut off, and on Windows the window buttons appear all at once.\n- Settings no longer has Back to browser."
