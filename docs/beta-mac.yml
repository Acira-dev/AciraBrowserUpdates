  "releaseName": "Acira Browser 0.1.0-beta.14.5",
  "releaseNotes": "- Workspaces: every workspace is always on screen. With more than fit in one row, the switcher wraps onto a second row (and more), so you can reach the last one in one click (a member's ask).\n- Sidebar Downloads: drag a finished file out of its row in the sidebar into a folder or another app, as you already could from the downloads popup.\n- Command search suggests your bookmarks, named as they are in the address field.\n- Invites: a Founding Contributor whose profile showed \"Enter Insider code\" instead of \"Invite someone\" now gets \"Invite someone\".\n- Invites can be a link. A friend who already has Acira clicks it and sees the same confirmation as with a code, with nothing to type.\n- Invite points: when a friend joins with your invite, members from No. 101 up get 25 points.\n- Settings: the dropdowns open right under their control at any page zoom. With Settings zoomed in, they opened far off to the bottom right, or not at all in Layout (a member's report).\n- Popups: Page info and right-click menus no longer flicker as they open, a second right-click elsewhere on the page no longer flashes grey, the download popup no longer jumps about while the pointer rests on it, and a popup opened while the sidebar changes places can no longer stay hidden.\n- Extensions: adding, removing or turning off an extension no longer gets stuck on \"Another extension change is being reviewed\", and an extension's own window opened from the right-click menu closes again (a member's report).\n- Going from the sidebar to the Mini rail, the rail's icons no longer dim and come back when the switch takes longer than usual.\n- Noël on Linux: the snow stays in the sidebar and never covers the page. Snow over the whole window is not offered on Linux.\n- Less battery use: Acira wakes up less often when nothing is happening, content blocking does less work for each request a page makes, and Now Playing's glow and the New Tab tip's glow rest while the window is not the one you are using.\n- Windows: the window buttons no longer cover the top-right controls of a page. Not yet tried on a real PC.\n- Linux: the setup files now include the checksum file the installer needs (it stopped with \"The release checksum file is missing\"), and the installer also finds the AppImage when it is in the folder above the setup files."
