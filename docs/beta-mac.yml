  "releaseNotes": "- Site colour: the sidebar and top bar take on the colour of the site you're on. Choose Off, Soft or Rich in Appearance.\n- Tabs can sit along the top, in a sidebar, or in a sidebar with the address bar.\n- Put the sidebar on the right, and make it Narrow, Standard or Wide.\n- Tab groups become folders with their own area, and a + opens a new tab inside a group.\n- Favorites can sit at the top or bottom, with a ring in the site's colour. You choose whether their tabs also show in the list.\n- Drag tabs and groups to another workspace.\n- Rounder tabs, and the selected tab's glow moves with you. The glow from playing artwork now reaches the sidebar.\n- A marker shows which tab has a link preview open.\n- A Pull requests folder can keep your GitHub pull requests up to date.\n- Windows: the page reaches the top, and the window buttons show in a small notch when you point there."
