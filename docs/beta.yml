  "releaseNotes": "- Coming from 13.11? This update brings all of Beta 14: a slim Mini sidebar, a smoother Seamless sidebar, Favorites as a stack and tab folders, New Tab backgrounds, a Now Playing card with picture in picture, and an Early Member mark.\n- Live wallpaper: your own video behind the New Tab, in Settings > New tab. Off until you add one, always muted, plays only while you look at it, and rests on its first frame on battery unless you allow it.\n- Notification panel: a website's notifications can appear in Acira, under a bell in the toolbar, instead of from the system. Off until you choose it in Settings > Site permissions.\n- Link preview has a new look: a chip and a side column, and a borderless rounded card that opens out of the link you clicked.\n- Split view: the Seamless sidebar and top bar now float over the live panes, so videos in a split keep playing when you hover the sidebar in.\n- Split view: the page stays under the split picker while you drag a tab, an arriving pane shows one title from the first frame, and closing a pane shows the live page at once.\n- Ctrl+Tab: with Pictures or Names on, the viewer comes up on every press, quick taps too, never stays on screen after quick presses, and a tap no longer greys the page.\n- Ctrl+Tab: a mouse resting under the viewer no longer takes the highlight, and a click on a row is not undone by the release.\n- Sidebar to the Mini rail: folding starts sooner after the click and its labels fade with the move. Opening from Mini brings in the Favorites the rail had no room for.\n- Favorites move as one thing between the sidebar and the Mini rail: the Christmas frost travels with its tile, and letter Favorites travel too.\n- The Mini rail is steadier: its Favorites no longer vanish after a quick switch to the sidebar and back, and a touchpad scrolls them at the pace of your hand.\n- With a gradient of your own colours, the Mini rail no longer shows a band of the wrong colour while the sidebar folds or opens.\n- A toolbar with its own colour now blends into the sidebar beside it, and into the Mini rail, instead of meeting it in a hard edge.\n- With Ambient mode off, the toolbar's colour flows into the margin beside the page and the sidebar's edge light continues under the page.\n- A sidebar on the right: closing it keeps its background, and switching the view beside it no longer shows a dark strip at the page's edge.\n- No blank frame when a tab changes from a web page to Settings, History, Downloads or the New Tab page.\n- Settings has a new order: Layout and Sidebar have their own pages, Transparency is its own group, a new Protection page shows what Acira blocks or guards, and a greyed row says what to turn on.\n- Settings search finds the words people type (see-through, glass, homepage, badge, hide address bar) in every language, and ranks settings above shortcut commands.\n- Settings can be found from Command search, and the toolbar's Appearance popup and the Acira menu lead straight to their settings.\n- Seamless button: an optional toolbar button, beside Focus, that you add in Customize toolbar (a member's ask).\n- Noël: the snow keeps falling. \"Keep snowing\" in Settings > Appearance is on by default; switch it off and the snow rests after 2 minutes without input (30 seconds on battery).\n- Noël: Shake the globe really shakes it, the New Tab's profile picture wears the Santa hat too, and nothing settles at the sidebar's foot any more.\n- Window opacity: dragged below the default it now goes to a glassier, see-through end, and the whole drag moves. Nothing changes from the default up.\n- Address field: the row for what you typed keeps still while you type. A link button shows while the pointer is over the field and copies the page's address in one click.\n- With a Narrow sidebar, a click in the address field (or Ctrl/Cmd+L) opens Command search with the whole address in it, selected, so a long link can be read and edited.\n- Bookmark suggestions in the address field show the bookmark's own name and its address, so two bookmarks on one site can be told apart.\n- Now Playing shows the track's real length when a short sound plays beside it, and no longer looks paused while music plays.\n- Automatic picture in picture: a player that swaps its video while the small window is open (ads, quality changes) no longer stops it for good, and it works again after you close the small window.\n- Less memory: a page loads the cookie-banner library only when it shows a banner, and Acira's pop-up layer rests after ten minutes in the background.\n- Less battery use: Acira's edge watcher sleeps while no window can be revealed, the pop-up layer draws only while a popup shows, and an inactive window asks for its colour light once instead of every 4 seconds.\n- Members: a new install shows a short welcome with an Early Member seal, for every profile that is here before version 1.0. A member's card follows the number on its certificate.\n- Nobody becomes an Insider automatically any more: a profile joins with the key it was given in Settings > About > Extras, and a profile that already has its pass keeps it.\n- When a report you sent is accepted and only adds points, you get the same bubble a new rank gets.\n- Fixed: an update can no longer be paused once its download has reached 100 %.\n- Fixed: each network page in Settings saves only its own part, so a privacy switch never writes over a DNS choice made elsewhere.\n- Fixed: in \"Sidebar + address\" with the sidebar on the right, the address block always comes to rest inside the sidebar.\n- Fixed: the Task manager's last row shows its lines whole in every language and keeps its icon beside the text.",
