  "releaseNotes": "- Installing a site as an app no longer closes Acira on Mac when the site has no icon.\n- A page asking \"Leave this site?\" no longer freezes Acira.\n- Always dark stays on when you zoom or open a link preview as a tab, and dark tabs can sleep again.\n- The site glow slides in with the sidebar, and a new page gets its colour sooner.\n- Without graphics acceleration, Reduce motion turns on by itself so Acira stays smooth.\n- Pinned extensions also sit at the top of the sidebar, and on Linux their popups open inside the window.\n- With the address bar in the sidebar, the sidebar stays open in Full and its button no longer misses a quick second press.\n- A download running when you quit can be resumed, and a full disk now says so.\n- Extension buttons work in private windows, and links from extension windows open as tabs.\n- Typing a Space's name in the command bar no longer closes tabs, and a damaged saved window no longer stops Acira from starting.\n- Acira uses less memory.",
